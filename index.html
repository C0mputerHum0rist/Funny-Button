<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cute Button</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f4f4;
    }

    .image-button {
      width: 200px;
      height: 200px;
      border: none;
      cursor: pointer;
      border-radius: 18px;
      background: url('https://grizly.club/uploads/posts/2023-08/1692549341_grizly-club-p-kartinki-krasnaya-knopka-bez-fona-33.jpg') center/cover no-repeat;
    }

    .video-overlay {
      position: fixed;
      inset: 0;
      display: none;
      background: #000;
      z-index: 10;
    }

    .video-overlay.active {
      display: block;
    }

    .video-overlay video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }
  </style>
</head>
<body>
  <button class="image-button" aria-label="Open video"></button>

  <div class="video-overlay" id="videoOverlay">
    <video id="video" autoplay playsinline>
      <source src="jdun.mp4" type="video/mp4" />
    </video>
  </div>

  <script>
    const btn = document.querySelector('.image-button');
    const overlay = document.getElementById('videoOverlay');
    const video = document.getElementById('video');

    btn.onclick = () => {
      overlay.classList.add('active');
      document.body.style.background = '#000';
      video.muted = false;
      video.volume = 1;
      document.documentElement.requestFullscreen?.();
      video.play().catch(() => {});
    };
  </script>
</body>
</html>
